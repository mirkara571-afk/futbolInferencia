        const dic_torneos = {1934:{"octavos":8,"cuartos":5,"semifinal":2,"3er_lugar":1, "final":1},

        function genera_torneos_del_agno(event, dic_back, agno)
        {
            /* al elegir una fase: si esa fase ya se predijo, se muestra su prediccion;
               si no, se muestra el fixture real. Cambiar de fase no pierde nada. */
            const selector = event.target;
            const fase_actual = selector.options[selector.selectedIndex].text;
            const n_partidos = dic_torneos[agno][fase_actual];
            if (!(container_2.innerHTML == ''))
            {
                container_2.innerHTML = '';
            }

            /* la última predicción del año cubre TODO el torneo: al cambiar de fase se
               muestra su parte para esa fase; si no hay predicción, el fixture real. */
            if (prediccion_actual)
            {
                document.getElementById("EsteEsMiMensaje").value = prediccion_actual.partidos;
                acomodador([fase_actual, n_partidos], agno);
                restaurarResultados(prediccion_actual);
            }
            else
            {
                document.getElementById("EsteEsMiMensaje").value = partidos_reales;
                acomodador([fase_actual, n_partidos], agno);
                limpiarResultados();
            }
        }

        function busca_torneos_del_agno(event)
        {
            const selector = event.target;
            const nuevo_agno = selector.options[selector.selectedIndex].text;

            /* si se cambia de mundial (o se reselecciona), se borra todo lo predicho del anterior */
            if (nuevo_agno !== agno_actual)
            {
                agno_actual = nuevo_agno;
                prediccion_actual = null;
                limpiarResultados();
            }

            if (!(container_1.innerHTML == ''))
            {
                container_1.innerHTML = '';
            }
            if (!(container_2.innerHTML == ''))
            {
                container_2.innerHTML = '';
            }

            const fases = dic_torneos[nuevo_agno] || {};
            let cuenta = 0;
            let select_0_fases = document.createElement("select");
            select_0_fases.class = "torneos";
            select_0_fases.id = "torneos";

            Object.entries(fases).forEach(([clave_1, valor_1]) =>
            {
                let op1 = new Option(clave_1, cuenta);
                op1.id = valor_1;
                select_0_fases.appendChild(op1);
                cuenta += 1;
            });

            /* al cambiar de fase: se pinta su prediccion guardada o el fixture real */
            select_0_fases.addEventListener("change", function (ev)
            {
                entradas.length = 0;
                genera_torneos_del_agno(ev, fases, nuevo_agno);
            });

            container_1.appendChild(select_0_fases);

            /* se pinta ya la primera fase (arregla que 1934 solo apareciera tras elegir otro) */
            if (select_0_fases.options.length)
            {
                select_0_fases.selectedIndex = 0;
                entradas.length = 0;
                genera_torneos_del_agno({target: select_0_fases}, fases, nuevo_agno);
            }
        }

        function inversion_de_equipos(event)
        {
            const newValue = event.target;
            let soporte0 = "";
            let soporte1 = "";
            let cuenta_0 = 0;

            for(let i=0; i<3; i++)
            {
                if(i==0)
                {
                    /* Se itera el contenido de "entradas" (selection_0, selection_1) con
                       la variable "inp_0"
                    */
                    entradas.forEach((inp_0) =>
                    {
                        /* Si el id (unico por equipo) de alguno de los selects iterados
                           coincide con la del seleccionado
                        */
                        if (inp_0.id == newValue.id)
                        {
                            let estado_select = container_1.querySelector('select').value;
                            if(cuenta_0==0)
                            {
                                soporte0 = inp_0.id;
                                soporte1 = newValue.value;
                            }
                            
                            inp_0.value = newValue.value;
                            cuenta_0+=1;
                        }
                    });
                }

                else if(i==1)
                {
                    entradas.forEach(inp_1 =>
                    {
                        if (inp_1.id==soporte1)
                        {
                            inp_1.value = soporte0;
                        }
                    });
                }

                else if(i==2)
                {
                    entradas.forEach(inp_2=>
                    {
                        if(inp_2.id==soporte0 || inp_2.id==soporte1)
                        {
                            inp_2.id=inp_2.value;
                        }
                    });
                }
            }
        }

        async function leerCSV()
        {
            /* variable del DOM que contiene la prediccion recibida por el script html, desde  
               el modelo de prediccion
            */
            const inputValue = document.getElementById('EsteEsMiMensaje').value;
            /* pasa la cadena JSON a el valor u objeto que este describa (hacemos un array con 
               el contenido recibido)
            */
            const dataArray = JSON.parse(inputValue);

            let cuenta = 0;
            /* se crea la cabecera del dataset a mostrar al usuario
            */
            dataset.push(["home","score","away","year"]);
            /* se ponen las filas con el id (cuenta) y los valores correspondientes a cada 
               partido (item.home, item.score, item.away, item.year), segun el diccionario que sale de "dataArray" para tener un array de prediccion listo para ser mostrado
            */
            dataArray.forEach((item, index) => {
                    dataset.push([cuenta, item.home, item.score, item.away, item.year]);
                    cuenta++;
                });
        }

        async function acomodador(Id_Op_FasesMundial, agno)
        {
            /* Id_Op_FasesMundial: contiene el nombre de la fase jugada y el numero de partidos 
               en la misma y en ese orden y agno contiene el año con mundial, seleccionado por el usuario
            */
           
            let grupos = [];
            let initialValue = 0;

            var paises_ = [];
            var paises_0 = [];
            var ListHomAwy_FaseActual = [];
            var puntajes = [];
            let principio = 0;
            let fin = 0;

            leerCSV();
            cuenta = 0;

            /* itero el contenido del sub-diccionario de "dic_torneos" para el año actual
               "agno". "Object.entries()" devuelve un arreglo de pares de clave y valor de un objeto
            */
            for(CLFasesMundial of Object.entries(dic_torneos[agno]))
            {
                /* sumatoria del numero de partidos que se disputan hasta alcanzar
                   la fase actual seleccionada (la entry 1 es el value del diccionario iterado)
                */
                principio+=(CLFasesMundial[1]);
                
                /* condicion de coincidencia entre el nombre de la fase jugada que entra por parametro "Id_Op_FasesMundial" en el index 0, y el nombre de la fase iterada del sub-diccionario del año que entra por parametro "agno"

                para tener el numero de partidos de la fase actual, se aprovecha la coincidencia y se le resta el tamaño de la fase actual a "principio" y se renombra la variable "principio" como dicha resta, mientras que el fin de la fase queda marcado como "principio" antes de la resta. Esto deja marcado el numero de los partidos al inicio y fin de la fase señalada por el usuario
                */
                if(Id_Op_FasesMundial[0]==CLFasesMundial[0])
                {
                    fin = principio;
                    principio = principio - CLFasesMundial[1];
                    break;
                }
            }

            /* del "dataset" que sale de la funcion "leerCSV" se itera el espacio entre "principio" y "fin"
            */
            for (let conte of dataset.slice(principio+1, fin+1))
            {
                /* "ListHomAwy_FaseActual" recibe al "home" y "away" que juegan cada partido de la fase seleccionada, estando dichos nombres en formato "string"
                */
                ListHomAwy_FaseActual.push([conte[1], conte[3]]);
                /* "puntajes" recibe el resultado del partido iterado de "dataset"
                */
                puntajes.push(conte[2]);
            }

            /* se iteran los indices de la fase presente en el recien generado array 
               "ListHomAwy_FaseActual"
            */
            for(i in ListHomAwy_FaseActual)
            {
                /* se coloca un id para cada pais pasando por "home" y "away" secuencialmente
                   en ese orden, segun marque el indice iterado por la fase iterada del mundial, dentro del Map "DicHomeAwayIds"
                */
                DicHomeAwayIds.set(ListHomAwy_FaseActual[i][0], cuenta);
                cuenta+=1;
                DicHomeAwayIds.set(ListHomAwy_FaseActual[i][1], cuenta);
                cuenta+=1;
            }
            cuenta = 0;
            /* se elimina del Map, la entrada correspondiente a "Unnamed: 0" que llega del 
               dataset, por defecto*/
            DicHomeAwayIds.delete("Unnamed: 0");

            /* en el array "paises_" se almacenan filas contenedoras de: el nombre de los 
               equipos "home" y "away" y los id marcados previamente para estos en el Map "DicHomeAwayIds"
            */ 
            for (let conte of dataset.slice(principio+1, fin+1))
            {
                paises_.push([conte[1], DicHomeAwayIds.get(conte[1])]);
                paises_.push([conte[3], DicHomeAwayIds.get(conte[3])]);
            }

            /* con "JSON.stringify" se pasa un valor javascript a un JSON string y
               con "Set" se almacenan los valores unicos en "paises_", entonces: para los valores unicos de "paises_" se aplica, a cada entrada, la convercion de entradas javascript, a entradas JSON y todo queda almacenado en "paises_00"
            */
            paises_00 = [...new Set(paises_.map(item => JSON.stringify([item[0], item[1]])))];
            /* con ".map" se aplica un ".parse" a cada entrada de "paises_00" para
               pasarlas de JSON a un formato javascript
            */
            paises_00 = paises_00.map(item => JSON.parse(item));

            /* se iteran los valores unicos definidos para pais e id del pais, en "paises_00"
            */
            for(let psto0 of paises_00)
            {
                /* en el array "paises_0" se almacenan pequeños diccionarios {text: nombre del equipo, value: id determinado para el equipo}
                */
                paises_0.push({ text: psto0[0], value: psto0[1] });
            }


            for (let i0=0; i0<Id_Op_FasesMundial[1]; i0++)
            /* se itera segun el partidos que haya en la fase actual seleccionada
               (48 partidos fase de grupos, pj) para crear una estructura de posicionamiento de selects y se añaden dichas estructuras, al array de 'grupos'
            */
            {
                let nuevo_div0 = document.createElement("table");
                let nuevo_div1 = document.createElement("tbody");
                let nuevo_div2 = document.createElement("tr");

                // metemos el "tr" en el "tbody"
                nuevo_div1.appendChild(nuevo_div2);
                // metemos el "tr - tbody" en un "table"
                nuevo_div0.appendChild(nuevo_div1);
                // metemos el "tr" en la lista "grupos"
                grupos.push(nuevo_div0.lastChild.lastChild);
            }

            /* se iteran los indices de las estructuras de posicionamiento de desplegables o selects
            */
            cuenta_1 = 0;
            for (let fase in grupos)
            /* Se van agregando, a cada una de las 6 estructuras 'tr' anteriores
               los 'inputs' y 'select' en el orden adecuado y con el formato
               apropiado.
            */
            {
                /* se crean los "select" donde irán los pises disputantes del desafio o
                   o fase elegida y se agregan al array general "entradas", para su posterior uso en la funcion de inversion
                */
                const selection_0 = document.createElement("select");
                const selection_1 = document.createElement("select");
                entradas.push(selection_0);
                entradas.push(selection_1);

                /* se crean los "input" donde irán los resultados de los partidos en la fase   
                   elegida y se toma el puntaje del partido para cada equipo, en la variable "puntos"
                */
                let input_0 = document.createElement('input');
                let input_1 = document.createElement('input');
                puntos = puntajes[cuenta_1].split(":");

                /* para el "input_0" e "input_1" se define un tipo, se define un valor default 
                   y unas dimensiones de ancho y alto de la etiqueta "input". Finalmente, se suma 1 al conteo de partidos
                */
                input_0.type = 'text';
                input_0.value = puntos[0]
                input_0.style.width = '25px';
                input_0.style.height = '20px';

                input_1.type = 'text';
                input_1.value = puntos[1]
                input_1.style.height = "20px";
                input_1.style.width = "25px";
                cuenta_1++;

                /* se iteran los pares equipo-id desde la variable "paises_0" con los paises 
                   que disputan la fase seleccionada
                */
                for(let psto of paises_0)
                {
                    /* desde "psto" se agregan a los "opcion_0" y "opcion_1" los nombres e id 
                       de los equipos que disputan partidos en la fase seleccionada
                    */
                    let opcion_0 = new Option(psto.text, psto.value);
                    let opcion_1 = new Option(psto.text, psto.value);

                    /* a los select creados se agregan los option generados, y se les asocia la 
                       funcion "inversion_de_equipos" para cuando se produzca un cambio de value en dicho select
                    */
                    selection_0.appendChild(opcion_0);
                    selection_0.addEventListener('change', inversion_de_equipos);
                    selection_1.appendChild(opcion_1);
                    selection_1.addEventListener('change', inversion_de_equipos);
                }

                /* se definen los "value" y "id" segun el los ids registrados en 
                   "DicHomeAwayIds" para cada clave "home" "away" que juegue la fase
                   del mundial seleccionada por el usuario
                */
                selection_0.value = DicHomeAwayIds.get(ListHomAwy_FaseActual[fase][0]);
                selection_1.value = DicHomeAwayIds.get(ListHomAwy_FaseActual[fase][1]);

                selection_0.id = DicHomeAwayIds.get(ListHomAwy_FaseActual[fase][0]);
                selection_1.id = DicHomeAwayIds.get(ListHomAwy_FaseActual[fase][1]);

                /* se señala en el array de estructuras de posicionamiento ("tr") de los select 
                   creados, la estructura donde se colocaran los correspondientes a la fase actual, además de los input con los puntajes default definidos previamente
                */
                fase_0 = grupos[fase];

                fase_0.appendChild(selection_0);
                fase_0.appendChild(input_0);
                fase_0.appendChild(input_1);
                fase_0.appendChild(selection_1);

                /* las estructuras "tr" ya habilitadas con partidos, se van agregando a su vez, 
                   en el objeto de "div" que señala la variable "container_2"
                */
                container_2.appendChild(fase_0);
            }
            /* acabado el proceso, se vacia el array "dataset"
            */
            dataset=[];
        }

        function enviarSeleccion_0()
        {
            /* esta funcion obtiene los partidos del mundial seleccionado por el usuario */
            let datos = {};
            /* si el input oculto esta en modo apagado
            */
            if(document.getElementById("onoff").value=="off")
            {
                /* se obtiene el nombre del mundial seleccionado en el select de mundiales
                */
                const fecha = document.getElementById("mundiales");
                const valorSeleccionado = fecha.options[fecha.selectedIndex].text;

                /* se crea un diccionario de envio al servidor con la funcion "fetch"
                */
                datos = {
                    fecha: valorSeleccionado
                };
            }

            /* se define el metodo (POST), el header y el body; se devuelve la promesa para
               poder esperar a que lleguen los partidos reales antes de pintar la fase */
            return fetch("{% url 'procesar_recepcion_0' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(datos)
            })
            .then(response => response.json())
            .then(data =>
            {
                partidos_reales = data.partidos_reales;
                document.getElementById("EsteEsMiMensaje").value = partidos_reales;
                dataset = [];
            })
            .catch(() => { dataset = []; });
        }

        function enviarSeleccion_1()
        {
            /* esta funcion reune y envia el contenido actual de la fase editado segun el gusto 
               del usuario y recibe la prediccion de respuesta
            */
            let valores = [];
            let ArrayLlis = [];
            let cuenta_2 = 0;
            let cuenta_3 = 1;
            /* se excluyen las casillas de metricas (clase "metrica"): los goles se leen por posicion
            */
            let entradas_0 = document.querySelectorAll('input:not(.metrica)');

            /* se itera el contenido de todos los select
            */
            /* se excluyen los select del editor de reglamento (clase "reglamento"), que no son equipos
            */
            for (let select_0 of document.querySelectorAll(`select:not(.reglamento)`))
            {
                /* se ignora el contenido del año seleccionado y el torneo seleccionado por el 
                    usuario
                */
                if (select_0.class != "mundiales" && select_0.class != "torneos") 
                {
                    /* para el select de partidos se obtiene iterativamente el nombre del 
                       equipo visible en el select
                    */
                    let texto_0 = select_0.options[select_0.selectedIndex].text;
                    /* dicho equipo se agrega en un array
                    */
                    valores.push(texto_0);
                    cuenta_2++;
                    if (cuenta_2 == 2) 
                    {
                        /* se agrega al array de equipos "valor", el puntaje para los equipos 
                           home y away, solo cuando se hayan iterado previamente los dos equipos
                        */
                        valores.push(entradas_0[cuenta_3].value);
                        cuenta_3++;
                        valores.push(entradas_0[cuenta_3].value);
                        cuenta_3++;
                        ArrayLlis.push(valores);
                        valores = [];
                        cuenta_2 = 0;
                    }
                }
                if (select_0.class == "torneos") 
                {
                    /* se agrega el nombre del torneo en "ArrayLlis"
                    */
                    ArrayLlis.push(select_0.options[select_0.selectedIndex].text);
                }
                if (select_0.class == "mundiales") 
                {
                    /* se agrega el nombre del mundial seleccionado por el usuario a "ArrayLlis"
                    */
                    ArrayLlis.push(select_0.options[select_0.selectedIndex].text);
                }
            }

            console.log(`ArrayLlis-0\n${ArrayLlis}`);
            /* Enviar datos al backend con el metodo POST, especificando que el body sera 
               tratado como formato JSON y la transformacion del contenido de ArrayLlis a formato JSON
            */
            fetch("{% url 'procesar_recepcion_1' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ recepcion: ArrayLlis, reglamento: leerReglamento(), drop_metricas: leerDropMetricas(), metricas_opcionales: leerMetricasOpcionales() }) // Envía como JSON
            })
            /* se parsea la respuesta del servidor para su manejo adecuado
            */
            .then(response => response.json())
            .then(data => {
                if (data.error)
                {
                    alert(data.error);
                } 
                else 
                {
                    /* se cambia el input oculto hacia el valor de los partidos que ha predicho 
                       el modelo presente en el servidor
                    */
                    document.getElementById("EsteEsMiMensaje").value = data.partidos;

                    /* se obtiene el año seleccionado en el desplegable de años con mundial
                    */
                    agno_selec = document.getElementById("mundiales").options[document.getElementById("mundiales").selectedIndex].text;
                    /* se obtiene la fase seleccionada en el desplegable de torneos o fases por 
                       mundial
                    */
                    select_fases = document.getElementById("torneos");
                    fase_selec = select_fases.options[select_fases.selectedIndex].text;
                    /* se obtiene el numero de partidos para la fase selecionada del mundial
                    */
                    n_partidos = dic_torneos[agno_selec][fase_selec];

                    /* se guarda la predicción (cubre todo el torneo): al cambiar de fase no se pierde */
                    const prediccion = {
                        partidos: data.partidos,
                        mejores_terceros: data.mejores_terceros,
                        llave_octavos: data.llave_octavos,
                        campeones: null,
                    };
                    prediccion_actual = prediccion;

                    /* se repinta la fase con sus resultados y se restauran sus tablas */
                    container_2.innerHTML = '';
                    entradas.length = 0;
                    acomodador([fase_selec, n_partidos], agno_selec);
                    restaurarResultados(prediccion);

                    /* Etapa G: peticion paralela del cuadro de campeones; si falla, solo se ve lo de siempre
                    */
                    fetch("{% url 'api_probabilidades' %}", {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                        body: JSON.stringify({ recepcion: ArrayLlis, drop_metricas: leerDropMetricas(), metricas_opcionales: leerMetricasOpcionales() })
                    })
                    .then(respuesta => respuesta.json())
                    .then(datos => {
                        prediccion.campeones = datos.campeones;
                        const actual = document.getElementById("torneos");
                        if (actual && actual.options[actual.selectedIndex].text === fase_selec)
                            pintarCampeones(datos.campeones);
                    })
                    .catch(() => pintarCampeones(null));
                }
            })
        }

        /* reglamentos FIFA de mejores terceros entregados por la vista (fuente de verdad: modulo.py)
        */
        const REGLAMENTOS_OFICIALES = JSON.parse(document.getElementById("reglamentos-terceros").textContent);
        const CLASIFICADOS = ["1A","1B","1C","1D","1E","1F","2A","2B","2C","2D","2E","2F"];

        /* los select del editor llevan la clase "reglamento" para que "enviarSeleccion_1" los ignore
        */
        function crearSelectReglamento(opciones, valor)
        {
            const select = document.createElement("select");
            select.className = "reglamento";
            opciones.forEach(([texto, valor_op]) => select.add(new Option(texto, valor_op)));
            select.value = valor;
            return select;
        }

        function crearTabla(titulo, encabezados)
        {
            const tabla = document.createElement("table");
            tabla.createCaption().textContent = titulo;
            const fila = tabla.createTHead().insertRow();
            encabezados.forEach(texto => fila.appendChild(document.createElement("th")).textContent = texto);
            return tabla;
        }

        /* arma el editor precargado con el reglamento FIFA del año; se oculta si el año no usa mejores terceros
        */
        function mostrarEditorReglamento(agno, modo_inicial = "oficial")
        {
            editor_reglamento.innerHTML = "";
            const oficial = REGLAMENTOS_OFICIALES[agno];
            editor_reglamento.hidden = !oficial;
            if (!oficial) return;

            const modo = crearSelectReglamento([["Reglamento FIFA oficial", "oficial"], ["Reglamento personalizado", "personalizado"]], modo_inicial);
            modo.id = "modo-reglamento";
            const tablas = document.createElement("div");
            tablas.hidden = modo_inicial === "oficial";
            modo.addEventListener("change", () => tablas.hidden = modo.value === "oficial");

            /* orden de los 8 partidos: local = 1ro o 2do de grupo, visitante ademas puede ser "Mejor 3ro"
            */
            const tabla_llave = crearTabla(`Orden de octavos ${agno}`, ["#", "Local", "Visitante"]);
            const opciones_local = CLASIFICADOS.map(c => [c, c]);
            const opciones_visita = [...opciones_local, ["Mejor 3ro", "3"]];
            oficial.llave.forEach((partido, i) =>
            {
                const [local, visita] = partido.split("-");
                const fila = tabla_llave.insertRow();
                fila.className = "partido";
                fila.insertCell().textContent = i + 1;
                fila.insertCell().appendChild(crearSelectReglamento(opciones_local, local));
                fila.insertCell().appendChild(crearSelectReglamento(opciones_visita, visita));
            });

            /* 15 combinaciones: cada select solo ofrece los terceros de los grupos de esa combinacion
            */
            const tabla_cruces = crearTabla("Rival de 1A, 1B, 1C y 1D según los grupos de los 4 mejores terceros", ["Grupos", "1A", "1B", "1C", "1D"]);
            Object.entries(oficial.cruces).forEach(([grupos, rivales]) =>
            {
                const fila = tabla_cruces.insertRow();
                fila.className = "cruce";
                fila.dataset.grupos = grupos;
                fila.insertCell().textContent = grupos;
                const opciones = [...grupos].map(g => [`3${g}`, g]);
                [...rivales].forEach(rival => fila.insertCell().appendChild(crearSelectReglamento(opciones, rival)));
            });

            const restaurar = document.createElement("button");
            restaurar.type = "button";
            restaurar.textContent = "Restaurar reglamento FIFA";
            restaurar.addEventListener("click", () => mostrarEditorReglamento(agno, "personalizado"));

            tablas.append(tabla_llave, tabla_cruces, restaurar);
            editor_reglamento.append(modo, tablas);
        }

        /* null = el servidor usa el reglamento FIFA; si no, mismo formato que ReglamentoTerceros.a_json()
        */
        function leerReglamento()
        {
            const modo = document.getElementById("modo-reglamento");
            if (editor_reglamento.hidden || !modo || modo.value === "oficial") return null;

            const llave = [...editor_reglamento.querySelectorAll("tr.partido")].map(fila =>
            {
                const [local, visita] = fila.querySelectorAll("select");
                return `${local.value}-${visita.value}`;
            });
            const cruces = {};
            editor_reglamento.querySelectorAll("tr.cruce").forEach(fila =>
            {
                cruces[fila.dataset.grupos] = [...fila.querySelectorAll("select")].map(s => s.value).join("");
            });
            return {llave, cruces};
        }

        /* catalogo de metricas entregado por la vista (fuente de verdad: modulo.py)
        */
        const CATALOGO_METRICAS = JSON.parse(document.getElementById("catalogo-metricas").textContent);

        /* pinta una casilla marcada por metrica; la clase "metrica" las saca de la lectura de goles en "enviarSeleccion_1"
        */
        function pintarCasillasMetricas(id_contenedor, metricas, tipo)
        {
            const contenedor = document.getElementById(id_contenedor);
            metricas.forEach(m =>
            {
                const etiqueta = document.createElement("label");
                const casilla = document.createElement("input");
                casilla.type = "checkbox";
                casilla.className = `metrica ${tipo}`;
                casilla.value = m;
                casilla.checked = true;
                etiqueta.append(casilla, ` ${m} `);
                contenedor.appendChild(etiqueta);
            });
        }

        /* metricas base desmarcadas (el servidor las neutraliza); vacio = se usan todas
        */
        function leerDropMetricas()
        {
            return [...document.querySelectorAll("input.metrica.base:not(:checked)")].map(c => c.value);
        }

        /* metricas opcionales marcadas (el servidor neutraliza las demas); vacio = ninguna
        */
        function leerMetricasOpcionales()
        {
            return [...document.querySelectorAll("input.metrica.opcional:checked")].map(c => c.value);
        }

        /* pinta una tabla generica a partir de un JSON orient="records" (textContent: sin inyeccion de HTML)
        */
        function pintarTabla(id_contenedor, titulo, json_filas)
        {
            const contenedor = document.getElementById(id_contenedor);
            contenedor.innerHTML = "";
            if (!json_filas) return;
            const filas = JSON.parse(json_filas);
            if (!filas.length) return;
            const columnas = Object.keys(filas[0]);
            const tabla = crearTabla(titulo, columnas);
            filas.forEach(f => { const fila = tabla.insertRow(); columnas.forEach(c => fila.insertCell().textContent = f[c]); });
            contenedor.appendChild(tabla);
        }

        /* Etapa G: cuadro de los 5 campeones mas probables (campeones = [{pais, campeon, final, semifinal}])
        */
        function pintarCampeones(campeones)
        {
            const contenedor = document.getElementById("tabla-campeones");
            contenedor.innerHTML = "";
            if (!campeones || !campeones.length) return;
            const tabla = crearTabla("Campeones más probables", ["#", "Selección", "% campeón", "% final", "% semifinal"]);
            campeones.forEach((f, i) =>
            {
                const fila = tabla.insertRow();
                fila.insertCell().textContent = i + 1;
                fila.insertCell().textContent = f.pais;
                fila.insertCell().textContent = (100 * f.campeon).toFixed(1) + "%";
                fila.insertCell().textContent = (100 * f.final).toFixed(1) + "%";
                fila.insertCell().textContent = (100 * f.semifinal).toFixed(1) + "%";
            });
            contenedor.appendChild(tabla);
        }

        /* limpia las tablas de resultados (al cambiar de año o de fase sin predicción) */
        function limpiarResultados()
        {
            ["tabla-terceros", "tabla-llave", "tabla-campeones", "llave-visual"].forEach(id =>
            {
                const el = document.getElementById(id);
                if (el) el.innerHTML = "";
            });
        }

        /* restaura las tablas de una predicción guardada */
        function restaurarResultados(prediccion)
        {
            pintarTabla("tabla-terceros", "Mejores terceros", prediccion.mejores_terceros);
            pintarTabla("tabla-llave", "Emparejamientos de octavos", prediccion.llave_octavos);
            pintarLlave(JSON.parse(prediccion.partidos || "[]"), agno_actual);
            if (prediccion.campeones) pintarCampeones(prediccion.campeones);
        }

        /* H.4: cuadro eliminatorio visual con las probabilidades por partido
        */
        function pintarLlave(partidos, agno)
        {
            const contenedor = document.getElementById("llave-visual");
            contenedor.innerHTML = "";
            if (!partidos || !partidos.length) return;

            const fases = dic_torneos[agno] || {};
            const n_grupos = fases["Fase de Grupos"] || 0;
            const knock = partidos.slice(n_grupos);
            if (!knock.length) return;

            const claves = ["16vos", "octavos", "cuartos", "semifinal", "final"];
            const nombres = {"16vos": "16vos", "octavos": "Octavos", "cuartos": "Cuartos", "semifinal": "Semifinal", "final": "Final"};

            const titulo = document.createElement("div");
            titulo.className = "titulo-llave";
            titulo.textContent = "Cuadro eliminatorio (predicción)";
            contenedor.appendChild(titulo);

            const cuadro = document.createElement("div");
            cuadro.className = "llave";
            let offset = 0;
            for (const c of claves)
            {
                const n = fases[c];
                if (!n) continue;
                const col = document.createElement("div");
                col.className = "ronda";
                const cab = document.createElement("div");
                cab.className = "ronda-titulo";
                cab.textContent = nombres[c];
                col.appendChild(cab);
                for (let i = 0; i < n; i++)
                {
                    /* la final es el ULTIMO partido del torneo; el 3er puesto (penultimo) no entra en la llave */
                    const p = (c === "final") ? knock[knock.length - 1] : knock[offset + i];
                    if (!p) continue;
                    const ficha = document.createElement("div");
                    ficha.className = "partido-llave";
                    const probs = (p.probs && p.probs.length === 3)
                        ? ` — ${Math.round(p.probs[0] * 100)}% / ${Math.round(p.probs[1] * 100)}% / ${Math.round(p.probs[2] * 100)}%`
                        : "";
                    ficha.textContent = `${p.home}  ${p.score}  ${p.away}${probs}`;
                    col.appendChild(ficha);
                }
                offset += n;
                cuadro.appendChild(col);
            }
            contenedor.appendChild(cuadro);
        }
        function getCookie(name) 
        {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') 
            {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) 
                {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) 
                    {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function inicio()
        {
            let cuenta = 0;
            /* al iniciar el documento creo este select "select_0_mundiales"
            */
            let select_0_mundiales = document.createElement("select");
            select_0_mundiales.class = "mundiales";
            select_0_mundiales.id = "mundiales";

            Object.entries(dic_torneos).forEach(([clave_0])=>
            {
                op0 = new Option(clave_0, cuenta);

                /* se agrega al "select_0_mundiales" los option de name "clave_0"
                   (o sea el año de cada mundial) y value "cuenta"
                */
                select_0_mundiales.appendChild(op0);

                cuenta+=1;
            });

            /* se agrega al select "select_0_mundiales" la funcion "busca_torneos_del_agno"
            */
            /* al cambiar de mundial: primero llegan los partidos reales y luego se pintan fases */
            select_0_mundiales.addEventListener("change", async (event) =>
            {
                await enviarSeleccion_0();
                busca_torneos_del_agno(event);
                mostrarEditorReglamento(event.target.options[event.target.selectedIndex].text);
            });
            /* se referencia al contenedor de inputs "container_0" que esta de antemano
               en  el "document" para agregarle el select "select_0_mundiales" donde
               estan todos los años con mundiales de futbol (quitando el 1930)
            */
            container_0.appendChild(select_0_mundiales);

            /* pinta el primer mundial al cargar (asi 1934 aparece sin trucos) */
            select_0_mundiales.selectedIndex = 0;
            enviarSeleccion_0().then(() => busca_torneos_del_agno({target: select_0_mundiales}));

            pintarCasillasMetricas("metricas-base", CATALOGO_METRICAS.base, "base");
            pintarCasillasMetricas("metricas-opcionales", CATALOGO_METRICAS.opcionales, "opcional");
        }

        /* se asocia la funcion "inicio", como desencadenante del programa, al iniciarse sesion 
           en el sitio web
        */
        document.addEventListener('DOMContentLoaded', inicio);

</script>
