name: CI

on:
  push:
    branches: [main, "exp/**", "feat/**", "fix/**", "refactor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bd_mundial
          POSTGRES_USER: mundial
          POSTGRES_PASSWORD: mundial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mundial -d bd_mundial"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: bd_mundial
      DB_USER: mundial
      DB_PASSWORD: mundial
      DB_HOST: localhost
      DB_PORT: "5432"
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (syntax / undefined names only)
        run: ruff check web --select E9,F63,F7,F82

      - name: Django checks
        working-directory: web
        run: python manage.py check

      - name: Tests
        working-directory: web
        run: python manage.py test fases -v 1
